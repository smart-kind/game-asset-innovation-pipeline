[build-system]
requires = ["setuptools", "pip", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "InvokeAI"
description = "A full-featured AI-assisted image generation environment designed for creatives and enthusiasts."
requires-python = ">=3.12, <3.13"
readme = { content-type = "text/markdown", file = "README.md" }
keywords = ["stable-diffusion", "AI"]
dynamic = ["version"]
license = { file = "LICENSE" }
authors = [{ name = "Invoke", email = "support@invoke.ai" }]
classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Environment :: GPU',
  'Environment :: GPU :: NVIDIA CUDA',
  'Environment :: MacOS X',
  'Intended Audience :: End Users/Desktop',
  'Intended Audience :: Developers',
  'License :: OSI Approved :: Apache Software License',
  'Operating System :: POSIX :: Linux',
  'Operating System :: MacOS',
  'Operating System :: Microsoft :: Windows',
  'Programming Language :: Python :: 3 :: Only',
  'Programming Language :: Python :: 3.12',
  'Topic :: Artistic Software',
  'Topic :: Internet :: WWW/HTTP :: WSGI :: Application',
  'Topic :: Internet :: WWW/HTTP :: WSGI :: Server',
  'Topic :: Multimedia :: Graphics',
  'Topic :: Scientific/Engineering :: Artificial Intelligence',
  'Topic :: Scientific/Engineering :: Image Processing',
]
dependencies = [
  # Core application dependencies, pinned for reproducible builds.
  "fastapi-events",
  # The old pin sat at 0.118.3 because 0.119.0 crashed generating our OpenAPI schema. That was a FastAPI bug, not
  # ours (`KeyError: '$ref'` in fastapi/_compat/v2.py, which assumed every field mapping carries a `$ref`), and it
  # is fixed as of 0.124.0 — no change to AnyInvocation was needed.
  #
  # Two later changes did need adapting to, both handled: 0.130 emits `contentMediaType` instead of
  # `format: binary` for file uploads (see the Blob mapping in frontend/api/scripts/typegen.js), and 0.141 keeps
  # included routers as a single node in `app.routes` rather than copying their routes into it (see
  # `_iter_route_contexts` in tests/app/routers/test_model_manager_authorization.py). Keep the minor-version bound:
  # both of those were silent breakages that only surfaced because something happened to assert on them.
  "fastapi>=0.141.1,<0.142",
  "huggingface-hub",
  "networkx",
  "pydantic-settings",
  "pydantic",
  "python-socketio",
  # Schema migrations that run on every database backend are written with Alembic's operations (no Alembic
  # environment or revision scripts).
  "alembic>=1.20,<2",
  # The database layer compiles every query through SQLAlchemy Core. Keep the minor-version bound: dialect
  # compilation and the pysqlite transaction handling it relies on are exactly what changes between minors.
  "sqlalchemy>=2.1,<2.2",
  "uvicorn[standard]; (sys_platform != 'win32' or platform_machine != 'ARM64')",
  # [standard] pulls httptools, which has no win_arm64 wheel; uvicorn falls back to h11. websockets and watchfiles
  # are the parts of [standard] the app uses.
  "uvicorn; sys_platform == 'win32' and platform_machine == 'ARM64'",
  "websockets; sys_platform == 'win32' and platform_machine == 'ARM64'",
  "watchfiles; sys_platform == 'win32' and platform_machine == 'ARM64'",

  # Auxiliary dependencies, pinned only if necessary.
  "blake3; (sys_platform != 'win32' or platform_machine != 'ARM64')",
  "blake3==1.0.9; sys_platform == 'win32' and platform_machine == 'ARM64'",   # self-built win_arm64 wheel (see invoke-win-arm64-wheels)
  "bcrypt>=4.1,<6",   # used directly (not via passlib, which is incompatible with bcrypt>=4.1 -- the first release with win_arm64 wheels)
  "Deprecated",
  "dnspython",
  "dynamicprompts",
  "einops",
  "email-validator>=2.0.0",
  "fonttools[woff]; (sys_platform != 'win32' or platform_machine != 'ARM64')",
  "fonttools; sys_platform == 'win32' and platform_machine == 'ARM64'",   # [woff] needs brotli, which has no win_arm64 wheel; woff2 fonts are skipped there
  "picklescan",
  "pillow>=12.3.0",
  "prompt-toolkit",
  "pypatchmatch",
  "PyJWT>=2.15.0",
  "python-multipart",
  "requests",
  "rembg",
  "onnxruntime",
  "pillow-avif-plugin",
  "opencv-contrib-python",
  "scipy",
  "semver~=3.0.1",
  "PyWavelets; (sys_platform != 'win32' or platform_machine != 'ARM64')",
  "PyWavelets>=1.10; sys_platform == 'win32' and platform_machine == 'ARM64'",   # first win_arm64 wheels

  # Semantic image index (image map / semantic search).
  # numba is a umap-learn transitive, pinned to the range this stack has been
  # exercised against rather than for numpy compatibility: every release from
  # 0.59 to at least 0.63 accepts the numpy 1.26.x resolved under numpy<2.0
  # above (0.62 widened its floor back to >=1.22). Raise the ceiling once a
  # newer numba has been run against the image map, not just resolved.
  # Not on Windows ARM64: numba/llvmlite ship win_arm64 wheels for Python 3.14 only. The image map falls back to a
  # PCA projection there (see image_index/projection.py).
  "umap-learn~=0.5.7; (sys_platform != 'win32' or platform_machine != 'ARM64')",
  "scikit-learn~=1.5",
  "numba>=0.59,<0.62; (sys_platform != 'win32' or platform_machine != 'ARM64')",
]

[project.optional-dependencies]
"onnx" = ["onnxruntime"]
# Neither GPU build of onnxruntime has win_arm64 wheels; the markers drop the package there, so on Windows ARM64
# these extras install nothing.
"onnx-cuda" = ["onnxruntime-gpu; (sys_platform != 'win32' or platform_machine != 'ARM64')"]
"onnx-directml" = ["onnxruntime-directml; (sys_platform != 'win32' or platform_machine != 'ARM64')"]
"dist" = ["pip-tools", "pipdeptree", "twine"]
"dev" = ["jurigged", "pudb", "snakeviz", "gprof2dot"]
"test" = [
  "ruff~=0.11.2",
  "ruff-lsp~=0.0.62",
  "mypy",
  "pre-commit",
  "pytest>6.0.0",
  "pytest-cov",
  "pytest-timeout",
  "pytest-xdist",
  "pytest-datadir",
  "requests_testadapter",
  "httpx",
  "polyfactory==2.19.0",
  "humanize==4.12.1",
]

[tool.uv]
index-strategy = "unsafe-best-match"
# Restrict resolution to the platforms we support: x86_64/aarch64 Linux, Windows
# (x64 and ARM64 -- both are `win32`), and macOS.
environments = ["sys_platform == 'win32' or sys_platform == 'darwin' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))"]
# Windows on ARM64 must stay installable: uv refuses to lock a wheel-only package that has no
# win_arm64 wheel. It does not cover packages that also publish an sdist (uv would happily lock
# one and the build would fail on the user's machine), which is why the `; sys_platform == 'win32'
# and platform_machine == 'ARM64'` forks above pin ARM64-capable versions explicitly, and why
# scripts/check_platform_locks.py walks the platform's whole closure for wheel availability.
required-environments = ["sys_platform == 'win32' and platform_machine == 'ARM64'"]

[tool.uv.sources]
# Windows ARM64 wheels PyPI does not provide, built by .github/workflows/build-win-arm64-wheels.yml
# and served from the release's index page. Elsewhere these resolve from PyPI as usual.
blake3 = [{ index = "invoke-win-arm64-wheels", marker = "sys_platform == 'win32' and platform_machine == 'ARM64'" }]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

# A flat (find-links style) page listing this repo's self-built win_arm64 wheels, published as
# release assets by .github/workflows/build-win-arm64-wheels.yml. Bump the tag together with the
# ARM64 pins of the packages it serves.
[[tool.uv.index]]
name = "invoke-win-arm64-wheels"
url = "https://github.com/invoke-ai/InvokeAI/releases/download/win-arm64-wheels-v1/index.html"
format = "flat"
explicit = true

[project.scripts]
"invokeai-web" = "invokeai.app.run_app:run_app"
"invoke-useradd" = "invokeai.app.util.user_management:useradd"
"invoke-userdel" = "invokeai.app.util.user_management:userdel"
"invoke-userlist" = "invokeai.app.util.user_management:userlist"
"invoke-usermod" = "invokeai.app.util.user_management:usermod"
"invoke-db-copy" = "invokeai.app.util.database_copy:main"

[project.urls]
"Homepage" = "https://invoke.ai/"
"Documentation" = "https://invoke.ai/"
"Source" = "https://github.com/invoke-ai/InvokeAI/"
"Bug Reports" = "https://github.com/invoke-ai/InvokeAI/issues"
"Discord" = "https://discord.gg/ZmtBAhwWhy"

[tool.setuptools.dynamic]
version = { attr = "invokeai.version.__version__" }

[tool.setuptools.packages.find]
"where" = ["."]
"include" = [
  "invokeai.assets.fonts*",
  "invokeai.version*",
  "invokeai.generator*",
  "invokeai.backend*",
  "invokeai.frontend*",
  "invokeai.frontend.webv1.dist*",
  "invokeai.frontend.webv1.static*",
  "invokeai.configs*",
  "invokeai.app*",
  "invokeai.invocation_api*",
]

[tool.setuptools.package-data]
"invokeai.app.assets" = ["**/*.png"]
"invokeai.backend.qwen3" = ["tokenizer/*.json", "tokenizer/*.json.gz"]
"invokeai.backend.qwen3_vl" = ["tokenizer/*.json", "tokenizer/*.json.gz", "config/*.json"]
"invokeai.backend.qwen3_5" = ["*.json", "tokenizer/*.json", "tokenizer/*.json.gz"]
"invokeai.backend.qwen2_5_vl" = ["*.json", "tokenizer/*.json", "tokenizer/*.json.gz"]
# Read at load time by the MiniMax H3 single-file encoder loader. Without this the file is
# absent from a wheel install and that loader raises FileNotFoundError.
"invokeai.backend.minimax_h3" = ["*.json"]
"invokeai.backend.t5" = ["tokenizer/*.json"]
# Fitted working-memory coefficients, read by every estimator that declares an EstimatorSpec.
"invokeai.backend.working_memory" = ["data/*.json"]
"invokeai.backend.clip" = ["*.json", "tokenizer/*.json", "tokenizer/*.gz"]
"invokeai.app.services.image_index" = ["*.txt"]
"invokeai.app.services.workflow_records.default_workflows" = ["*.json"]
"invokeai.backend.hidiffusion" = ["sd_module_key/*.txt"]
"invokeai.app.services.style_preset_records" = ["*.json"]
"invokeai.app.services.style_preset_images.default_style_preset_images" = [
  "*.png",
]
"invokeai.assets.fonts" = ["**/*.ttf"]
"invokeai.backend" = ["**.png", "**/*.icc"]
"invokeai.configs" = ["*.example", "**/*.yaml", "*.txt"]
"invokeai.frontend.webv1.dist" = ["**"]
"invokeai.frontend.webv2.dist" = ["**"]
"invokeai.frontend.webv1.static" = ["**"]
"invokeai.app.invocations" = ["**"]

#=== Begin: PyTest and Coverage
[tool.pytest.ini_options]
# `--dist loadfile` keeps a file's tests together on one xdist worker, so module-scoped
# fixtures are set up once per file instead of in every worker that received part of it.
# It is not isolation: a worker process runs many files, in an order that depends on the
# worker count and on which file finished first, so a file must still set up its own
# process-global state. It costs nothing -- per-test distribution measured the same wall
# clock on the full suite -- and it lives here rather than in the CI command so that it
# also holds when `-n` is passed by hand. Coverage is opt-in via `--cov`.
addopts = "--strict-markers --dist loadfile -m \"not slow\""
markers = [
  "slow: Marks tests as slow. Disabled by default. To run all tests, use -m \"\". To run only slow tests, use -m \"slow\".",
  "timeout: Marks the timeout override.",
  "uses_database: Runs on the `empty_database` fixture, which targets INVOKEAI_TEST_DB_URL when it is set and SQLite otherwise. Applied by the collection hook in tests/conftest.py.",
  "sqlite_only: Depends on SQLite internals (query plans, PRAGMAs, the single connection); skipped when INVOKEAI_TEST_DB_URL targets another backend.",
  "platform_independent: The outcome cannot depend on the operating system for the same dependency set: import-graph boundaries in a fresh interpreter, static source scans, deterministic counts and shapes. Windows CI, which installs the linux dependency set, deselects them.",
  "ffmpeg: Runs an ffmpeg binary or loads the libav libraries. The windows-cpu CI job, whose Server Core runner cannot load them, deselects them; windows-ffmpeg runs only these.",
]
# A cache-key or other SQLAlchemy warning is a bug in the query layer, not noise.
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
[tool.coverage.run]
branch = true
source = ["invokeai"]
omit = ["*tests*", "*migrations*", ".venv/*", "*.env"]
[tool.coverage.report]
show_missing = true
fail_under = 85     # let's set something sensible on Day 1 ...
[tool.coverage.json]
output = "coverage/coverage.json"
pretty_print = true
[tool.coverage.html]
directory = "coverage/html"
[tool.coverage.xml]
output = "coverage/index.xml"
#=== End: PyTest and Coverage

#=== Begin: Ruff
[tool.ruff]
line-length = 120
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  "invokeai/frontend/api/node_modules/",
  "invokeai/frontend/webv1/node_modules/",
  "invokeai/frontend/webv2/node_modules/",
  ".venv*",
  "*.ipynb",
  "invokeai/backend/image_util/mediapipe_face/", # External code
  "invokeai/backend/image_util/mlsd/",           # External code
  "invokeai/backend/image_util/normal_bae/",     # External code
  "invokeai/backend/image_util/pidi/",           # External code
  "invokeai/backend/image_util/imwatermark/",    # External code
]

[tool.ruff.lint]
ignore = [
  "E501", # https://docs.astral.sh/ruff/rules/line-too-long/
  "C901", # https://docs.astral.sh/ruff/rules/complex-structure/
  "B008", # https://docs.astral.sh/ruff/rules/function-call-in-default-argument/
  "B904", # https://docs.astral.sh/ruff/rules/raise-without-from-inside-except/
]
select = ["B", "C", "E", "F", "W", "I", "TID"]

[tool.ruff.lint.per-file-ignores]
# Vendored from the diffusers MiniMax-H3 branch (see invokeai/backend/minimax_h3/__init__.py);
# kept as close to upstream as possible, so upstream's zip() style is tolerated.
"invokeai/backend/minimax_h3/transformer_minimax_h3.py" = ["B905"]
"invokeai/backend/minimax_h3/autoencoder_kl_minimax_h3.py" = ["B905"]
"invokeai/backend/minimax_h3/autoencoder_kl_minimax_h3_audio.py" = ["B905"]
"invokeai/backend/minimax_h3/scheduling_minimax_h3.py" = ["B905"]

[tool.ruff.format]
# The vendored MiniMax-H3 files are kept byte-identical to upstream diffusers (modulo the
# absolute-import rewrite) so that re-syncing when a tagged diffusers ships them is a clean copy
# rather than a manual re-application of formatting. Upstream wraps at a narrower line length, so
# `ruff format` would rewrap lines for no semantic gain. `ruff check` still runs on them, so the
# import sorting this project does enforce stays enforced.
#
# Listed file by file rather than as a directory glob: the package also holds first-party modules
# (presets.py, sampling.py, denoise.py, int8_convrot.py, ...) which must stay formatted.
exclude = [
  "invokeai/backend/minimax_h3/packing.py",
  "invokeai/backend/minimax_h3/transformer_minimax_h3.py",
  "invokeai/backend/minimax_h3/autoencoder_kl_minimax_h3.py",
  "invokeai/backend/minimax_h3/autoencoder_kl_minimax_h3_audio.py",
  "invokeai/backend/minimax_h3/scheduling_minimax_h3.py",
]

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"

#=== End: Ruff

#=== Begin: MyPy

# global mypy config
[tool.mypy]
ignore_missing_imports = true # ignores missing types in third-party libraries
strict = true
plugins = "pydantic.mypy"
exclude = ["tests/*"]

# overrides for specific modules
[[tool.mypy.overrides]]
follow_imports = "skip" # skips type checking of the modules listed below
module = [
  "invokeai.app.api.routers.models",
  "invokeai.app.invocations.text_encoder.compel",
  "invokeai.app.invocations.sd.denoise_latents",
  "invokeai.app.services.invocation_stats.invocation_stats_default",
  "invokeai.app.services.model_manager.model_manager_base",
  "invokeai.app.services.model_manager.model_manager_default",
  "invokeai.app.services.model_manager.store.model_records_sql",
  "invokeai.app.util.controlnet_utils",
  "invokeai.backend.image_util.txt2mask",
  "invokeai.backend.image_util.safety_checker",
  "invokeai.backend.image_util.patchmatch",
  "invokeai.backend.image_util.invisible_watermark",
  "invokeai.backend.install.model_install_backend",
  "invokeai.backend.ip_adapter.ip_adapter",
  "invokeai.backend.ip_adapter.resampler",
  "invokeai.backend.ip_adapter.unet_patcher",
  "invokeai.backend.model_management.convert_ckpt_to_diffusers",
  "invokeai.backend.model_management.lora",
  "invokeai.backend.model_management.model_cache",
  "invokeai.backend.model_management.model_manager",
  "invokeai.backend.model_management.model_merge",
  "invokeai.backend.model_management.model_probe",
  "invokeai.backend.model_management.model_search",
  "invokeai.backend.model_management.models.*",                            # this is needed to ignore the module's `__init__.py`
  "invokeai.backend.model_management.models.base",
  "invokeai.backend.model_management.models.controlnet",
  "invokeai.backend.model_management.models.ip_adapter",
  "invokeai.backend.model_management.models.lora",
  "invokeai.backend.model_management.models.sdxl",
  "invokeai.backend.model_management.models.stable_diffusion",
  "invokeai.backend.model_management.models.vae",
  "invokeai.backend.model_management.seamless",
  "invokeai.backend.model_management.util",
  "invokeai.backend.stable_diffusion.diffusers_pipeline",
  "invokeai.backend.stable_diffusion.diffusion.shared_invokeai_diffusion",
  "invokeai.backend.util.hotfixes",
  "invokeai.backend.util.mps_fixes",
  "invokeai.backend.util.util",
  "invokeai.frontend.install.model_install",
]
#=== End: MyPy

[tool.pyright]
# Start from strict mode
typeCheckingMode = "strict"
# This errors whenever an import is missing a type stub file - way too noisy
reportMissingTypeStubs = "none"
# These are the rest of the rules enabled by strict mode - enable them @ warning
reportConstantRedefinition = "warning"
reportDeprecated = "warning"
reportDuplicateImport = "warning"
reportIncompleteStub = "warning"
reportInconsistentConstructor = "warning"
reportInvalidStubStatement = "warning"
reportMatchNotExhaustive = "warning"
reportMissingParameterType = "warning"
reportMissingTypeArgument = "warning"
reportPrivateUsage = "warning"
reportTypeCommentUsage = "warning"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryContains = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnusedClass = "warning"
reportUnusedImport = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportUntypedBaseClass = "warning"
reportUntypedClassDecorator = "warning"
reportUntypedFunctionDecorator = "warning"
reportUntypedNamedTuple = "warning"
